<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markaz al-Mona</title>
    <link rel="icon" href="assets/Logo.jng" type="img/.jpg">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Стили для интеграции переключателя языков Google */
        .lang-switcher-container {
            display: flex;
            align-items: center;
            margin-left: 15px;
        }
        
        /* Скрываем стандартный текст Google "Select Language" */
        .goog-te-gadget {
            color: transparent !important;
            font-size: 0 !important;
        }
        
        /* Стилизуем сам выпадающий список, чтобы он подходил под дизайн */
        .goog-te-gadget .goog-te-combo {
            padding: 4px 8px;
            border: 1px solid #e6dbcf;
            border-radius: 4px;
            background-color: #fff;
            color: #333;
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
            outline: none;
            transition: border-color 0.2s;
        }
        
        .goog-te-gadget .goog-te-combo:hover {
            border-color: var(--accent-color, #8c6239);
        }

        /* Прячем верхнюю панель Google фрейма, которая появляется после перевода */
        body {
            top: 0 !important;
        }
        .goog-te-banner-frame.skiptranslate {
            display: none !important;
        }
        .goog-tooltip {
            display: none !important;
        }
        .goog-tooltip:hover {
            display: none !important;
        }
        .goog-text-highlight {
            background-color: transparent !important;
            box-shadow: none !important;
        }

        /* Элемент перевода внутри мобильного меню */
        .nav__list .mobile-lang {
            display: none;
            padding: 15px 0;
            border-top: 1px solid #eee;
            margin-top: 15px;
        }

        @media (max-width: 991px) {
            /* Скрываем переключатель из десктопной шапки на мобилках */
            .header__container > .lang-switcher-container {
                display: none;
            }
            /* Показываем переключатель внутри открывающегося бургер-меню */
            .nav__list .mobile-lang {
                display: block;
            }
        }
    </style>
</head>
<body>

<header class="header">
  <div class="header__container">
    <a href="index.html" class="logo">
      <img src="assets/Logo.jpg" alt="Markaz Al-Mona" class="logo__img">
      <span class="logo__text">MARKAZ AL-MONA</span>
    </a>

    <button class="burger-menu" aria-label="Открыть меню" id="burgerButton">
      <span class="burger-menu__line"></span>
    </button>

    <nav class="nav" id="navMenu">
      <ul class="nav__list">
        <li><a href="index.html#about" class="nav__link">О ЦЕНТРЕ</a></li>
        <li><a href="index.html#formats" class="nav__link">ТАРИФЫ</a></li>
        <li><a href="index.html#lessons" class="nav__link">УРОКИ</a></li>
        <li><a href="blog.html" class="nav__link">БЛОГ</a></li>
        <li><a href="index.html#contacts" class="nav__link">СВЯЗЬ</a></li>
        <li><a href="nabors.html" class="nav__link">НАБОРЫ</a></li>
        <li><a href="rules.html" class="nav__link">Правила</a></li>
        <li class="mobile-lang">
            <div id="google_translate_element_mobile"></div>
        </li>
      </ul>
    </nav>

    <div class="lang-switcher-container">
        <div id="google_translate_element_desktop"></div>
    </div>
  </div>
</header>
    <section class="nabors-section">
        <div class="nabors-container">
            <p class="nabors-subtitle">КУРСЫ</p>
            <h2 class="nabors-title">АКТУАЛЬНЫЕ НАБОРЫ</h2>
            
            <div class="slider-viewport">
                <div class="slider-track">
                    
                    <div class="nabor-card">
                        <img src="assets/image10.jpg.png" alt="Мединский курс 1 том" class="nabor-img">
                    </div>

                    <div class="nabor-card">
                        <img src="assets/image11.jpg.png" alt="Байна Ядайк" class="nabor-img">
                    </div>

                    <div class="nabor-card">
                        <img src="assets/image12.jpg.png" alt="Котру Нада" class="nabor-img">
                    </div>

                </div>
            </div>

            <div class="slider-controls">
                <button class="slider-arrow prev-btn" aria-label="Назад">&#8592;</button>
                <div class="slider-dots"></div>
                <button class="slider-arrow next-btn" aria-label="Вперед">&#8594;</button>
            </div>

            <div class="nabors-action">
                <a href="https://t.me/ArabicMarkaz_Mona/4288" target="_blank" class="nabor-main-btn">Записаться на курс</a>
            </div>

        </div>
    </section>

    <script src="script.js"></script>
    <script src="nabors.js"></script> <script>
        // Код управления мобильным меню (бургер) оставляем здесь
        document.addEventListener('DOMContentLoaded', () => {
            const burgerButton = document.getElementById('burgerButton');
            const navMenu = document.getElementById('navMenu');

            if (burgerButton && navMenu) {
                burgerButton.addEventListener('click', () => {
                    navMenu.classList.toggle('active');
                    burgerButton.classList.toggle('open'); 
                });

                const navLinks = navMenu.querySelectorAll('.nav__link');
                navLinks.forEach(link => {
                    link.addEventListener('click', () => {
                        navMenu.classList.remove('active');
                        burgerButton.classList.remove('open');
                    });
                });
            }
        });
    </script>
</body>
</html>
