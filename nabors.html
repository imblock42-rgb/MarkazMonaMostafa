<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markaz al-Mona</title>
    <link rel="icon" href="assets/Logo.jng" type="img/.jpg">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Стильный кастомный переключатель языков */
        .lang-switcher {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-left: 15px;
        }

        .lang-btn {
            background: none;
            border: 1px solid #e6dbcf;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            color: #333;
            transition: all 0.2s ease;
        }

        .lang-btn:hover {
            border-color: var(--accent-color, #8c6239);
            color: var(--accent-color, #8c6239);
        }

        .lang-btn.is-active {
            background-color: var(--accent-color, #8c6239);
            border-color: var(--accent-color, #8c6239);
            color: #fff;
        }

        /* Адаптив для мобильного меню */
        .nav__list .mobile-lang-wrapper {
            display: none;
            padding: 20px 0;
            border-top: 1px solid #f0f0f0;
            margin-top: 20px;
            width: 100%;
        }

        .mobile-lang-wrapper .lang-switcher {
            margin-left: 0;
            justify-content: flex-start;
        }

        @media (max-width: 991px) {
            /* Скрываем переключатель из шапки на мобилках */
            .header__container > .lang-switcher {
                display: none;
            }
            /* Показываем переключатель внутри открытого бургер-меню */
            .nav__list .mobile-lang-wrapper {
                display: block;
            }
        }

        /* Скрываем сам некрасивый оригинальный виджет Google */
        #google_translate_element, .skiptranslate, .goog-te-banner-frame, .goog-tooltip {
            display: none !important;
        }
        .goog-text-highlight {
            background-color: transparent !important;
            box-shadow: none !important;
        }
        body {
            top: 0 !important;
        }

        /* ==========================================================================
           ВОЗВРАЩАЕМ СТИЛИ СЛАЙДЕРА И НАБОРОВ (ТО, ЧТО ПРОПАЛО)
           ========================================================================== */
        .nabors-section {
            padding: 40px 20px;
            background-color: #fff;
            text-align: center;
        }

        .nabors-container {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
        }

        .nabors-subtitle {
            font-size: 0.9rem;
            letter-spacing: 2px;
            color: var(--accent-color, #8c6239);
            margin-bottom: 5px;
            font-weight: bold;
        }

        .nabors-title {
            font-size: 2rem;
            margin-bottom: 30px;
            color: #333;
        }

        /* Оболочка слайдера (скрывает вылезающие карточки) */
        .slider-viewport {
            overflow: hidden;
            width: 100%;
            margin: 0 auto 25px auto;
            max-width: 380px; /* Ограничиваем ширину под одну карточку, как на макетах */
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        /* Дорожка слайдера, которая двигается через JS */
        .slider-track {
            display: flex;
            transition: transform 0.4s ease-in-out;
            width: 100%;
        }

        /* Сама карточка набора */
        .nabor-card {
            min-width: 100%;
            box-sizing: border-box;
            background: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Адаптивные изображения внутри карточек */
        .nabor-img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
            max-height: 500px; /* Чтобы картинка не была бесконечно огромной */
        }

        /* Элементы управления слайдером */
        .slider-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .slider-arrow {
            background: #fff;
            border: 1px solid #e6dbcf;
            color: #333;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .slider-arrow:hover {
            background-color: var(--accent-color, #8c6239);
            border-color: var(--accent-color, #8c6239);
            color: #fff;
        }

        .slider-dots {
            display: flex;
            gap: 8px;
        }

        /* Стилизация точек слайдера (если создаются скриптом) */
        .slider-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: #e6dbcf;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .slider-dot.active {
            background-color: var(--accent-color, #8c6239);
        }

        /* Кнопка записи */
        .nabors-action {
            margin-top: 20px;
        }

        .nabor-main-btn {
            display: inline-block;
            background-color: var(--accent-color, #8c6239);
            color: #fff;
            padding: 14px 35px;
            border-radius: 50px;
            text-decoration: none;
            font-weight: bold;
            transition: transform 0.2s, background-color 0.2s;
            box-shadow: 0 4px 10px rgba(140, 98, 57, 0.3);
        }

        .nabor-main-btn:hover {
            background-color: #734e2c;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

<header class="header">
  <div class="header__container">
    <a href="index.html" class="logo">
      <img src="assets/Logo.jpg" alt="Markaz Al-Mona" class="logo__img">
      <span class="logo__text">MARKAZ AL-MONA</span>
    </a>

    <button class="burger-menu" aria-label="Открыть меню" id="burgerButton">
      <span class="burger-menu__line"></span>
    </button>

    <nav class="nav" id="navMenu">
      <ul class="nav__list">
        <li><a href="index.html#about" class="nav__link">О ЦЕНТРЕ</a></li>
        <li><a href="index.html#formats" class="nav__link">ТАРИФЫ</a></li>
        <li><a href="index.html#lessons" class="nav__link">УРОКИ</a></li>
        <li><a href="blog.html" class="nav__link">БЛОГ</a></li>
        <li><a href="index.html#contacts" class="nav__link">СВЯЗЬ</a></li>
        <li><a href="nabors.html" class="nav__link">НАБОРЫ</a></li>
        <li><a href="rules.html" class="nav__link">Правила</a></li>
        
        <!-- НА ТЕЛЕФОНЕ: Появится в самом низу мобильного меню -->
        <li class="mobile-lang-wrapper">
            <div class="lang-switcher">
                <button class="lang-btn is-active" onclick="changeLanguage('ru')">RU</button>
                <button class="lang-btn" onclick="changeLanguage('ar')">AR</button>
                <button class="lang-btn" onclick="changeLanguage('en')">EN</button>
            </div>
        </li>
      </ul>
    </nav>

    <!-- НА КОМПЬЮТЕРЕ: Отображается в шапке справа -->
    <div class="lang-switcher">
        <button class="lang-btn is-active" onclick="changeLanguage('ru')">RU</button>
        <button class="lang-btn" onclick="changeLanguage('ar')">AR</button>
        <button class="lang-btn" onclick="changeLanguage('en')">EN</button>
    </div>
  </div>
</header>

    <!-- Скрытый контейнер, необходимый для работы скрипта Google -->
    <div id="google_translate_element"></div>

    <!-- Изменили отступ со 40px на 120px, чтобы контент не залезал под фиксированную шапку -->
    <section class="nabors-section" style="margin-top: 120px;">
        <div class="nabors-container">
            <p class="nabors-subtitle">КУРСЫ</p>
            <h2 class="nabors-title">АКТУАЛЬНЫЕ НАБОРЫ</h2>
            
            <div class="slider-viewport">
                <div class="slider-track">
                    
                    <div class="nabor-card">
                        <img src="assets/image10.jpg.png" alt="Мединский курс 1 том" class="nabor-img">
                    </div>

                    <div class="nabor-card">
                        <img src="assets/image11.jpg.png" alt="Байна Ядайк" class="nabor-img">
                    </div>

                    <div class="nabor-card">
                        <img src="assets/image12.jpg.png" alt="Котру Нада" class="nabor-img">
                    </div>

                </div>
            </div>

            <div class="slider-controls">
                <button class="slider-arrow prev-btn" aria-label="Назад">&#8592;</button>
                <div class="slider-dots"></div>
                <button class="slider-arrow next-btn" aria-label="Вперед">&#8594;</button>
            </div>

            <div class="nabors-action">
                <a href="https://t.me/ArabicMarkaz_Mona/4288" target="_blank" class="nabor-main-btn">Записаться на курс</a>
            </div>

        </div>
    </section>

    <script src="script.js"></script>
    <script src="nabors.js"></script> 
    
    <!-- СКРИПТЫ УПРАВЛЕНИЯ ПЕРЕВОДОМ GOOGLE -->
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'ru',
                includedLanguages: 'ru,ar,en',
                autoDisplay: false
            }, 'google_translate_element');
        }

        function changeLanguage(langCode) {
            const googleSelect = document.querySelector('.goog-te-combo');
            if (googleSelect) {
                googleSelect.value = langCode;
                googleSelect.dispatchEvent(new Event('change'));
                
                // Синхронное переключение активного класса на кнопках (ПК и Мобильные)
                document.querySelectorAll('.lang-btn').forEach(btn => {
                    if(btn.getAttribute('onclick').includes(`'${langCode}'`)) {
                        btn.classList.add('is-active');
                    } else {
                        btn.classList.remove('is-active');
                    }
                });
            }
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <script>
        // Код управления мобильным меню (бургер)
        document.addEventListener('DOMContentLoaded', () => {
            const burgerButton = document.getElementById('burgerButton');
            const navMenu = document.getElementById('navMenu');

            if (burgerButton && navMenu) {
                burgerButton.addEventListener('click', () => {
                    navMenu.classList.toggle('active');
                    burgerButton.classList.toggle('open'); 
                });

                const navLinks = navMenu.querySelectorAll('.nav__link');
                navLinks.forEach(link => {
                    link.addEventListener('click', () => {
                        navMenu.classList.remove('active');
                        burgerButton.classList.remove('open');
                    });
                });
            }
        });
    </script>
</body>
</html>
