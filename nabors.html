<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markaz al-Mona</title>
    <link rel="icon" href="assets/Logo.jng" type="img/.jpg">
    <link rel="stylesheet" href="style.css">
    <style>
        /* Стильный кастомный переключатель языков */
        .lang-switcher {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-left: 15px;
        }

        .lang-btn {
            background: none;
            border: 1px solid #e6dbcf;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            color: #333;
            transition: all 0.2s ease;
        }

        .lang-btn:hover {
            border-color: var(--accent-color, #8c6239);
            color: var(--accent-color, #8c6239);
        }

        .lang-btn.is-active {
            background-color: var(--accent-color, #8c6239);
            border-color: var(--accent-color, #8c6239);
            color: #fff;
        }

        /* Адаптив для мобильного меню */
        .nav__list .mobile-lang-wrapper {
            display: none;
            padding: 20px 0;
            border-top: 1px solid #f0f0f0;
            margin-top: 20px;
            width: 100%;
        }

        .mobile-lang-wrapper .lang-switcher {
            margin-left: 0;
            justify-content: flex-start;
        }

        @media (max-width: 991px) {
            .header__container > .lang-switcher {
                display: none;
            }
            .nav__list .mobile-lang-wrapper {
                display: block;
            }
        }

        /* Скрываем сам некрасивый оригинальный виджет Google */
        #google_translate_element, .skiptranslate, .goog-te-banner-frame, .goog-tooltip {
            display: none !important;
        }
        .goog-text-highlight {
            background-color: transparent !important;
            box-shadow: none !important;
        }
        body {
            top: 0 !important;
        }

        /* ==========================================================================
           СТИЛИ СЛАЙДЕРА
           ========================================================================== */
        .nabors-section {
            padding: 40px 20px;
            background-color: #fff;
            text-align: center;
        }

        .nabors-container {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
        }

        .nabors-subtitle {
            font-size: 0.9rem;
            letter-spacing: 2px;
            color: #8c6239;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .nabors-title {
            font-size: 2rem;
            margin-bottom: 30px;
            color: #333;
            font-weight: 700;
        }

        /* Окно просмотра: строго показывает только одну картинку */
        .slider-viewport {
            overflow: hidden;
            width: 100%;
            max-width: 380px; 
            margin: 0 auto 25px auto;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }

        /* Лента, которая сдвигается с помощью JavaScript */
        .slider-track {
            display: flex;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            width: 100%;
        }

        /* Контейнер для слайда */
        .nabor-card {
            min-width: 100%;
            max-width: 100%;
            box-sizing: border-box;
            background: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Картинка */
        .nabor-img {
            width: 100%;
            height: auto;
            display: block;
            object-fit: contain;
        }

        /* Блок управления со стрелками и точками */
        .slider-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 30px;
        }

        /* Круглые стрелочки */
        .slider-arrow {
            background: #fff;
            border: 1px solid #dcd1c4;
            color: #333;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            outline: none;
            user-select: none;
        }

        .slider-arrow:hover {
            border-color: #8c6239;
            color: #8c6239;
            background-color: #faf8f5;
        }

        /* Индикаторы-точки */
        .slider-dots {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .slider-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #e6dbcf;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .slider-dot.active {
            background-color: #8c6239;
        }

        /* Золотистая кнопка действия */
        .nabors-action {
            margin-top: 10px;
        }

        .nabor-main-btn {
            display: inline-block;
            background-color: #bfa36a; 
            color: #fff;
            padding: 14px 45px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(191, 163, 106, 0.2);
        }

        .nabor-main-btn:hover {
            background-color: #ab8f57;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(191, 163, 106, 0.3);
        }
    </style>
</head>
<body>

<header class="header">
  <div class="header__container">
    <a href="index.html" class="logo">
      <img src="assets/Logo.jpg" alt="Markaz Al-Mona" class="logo__img">
      <span class="logo__text">MARKAZ AL-MONA</span>
    </a>

    <button class="burger-menu" aria-label="Открыть меню" id="burgerButton">
      <span class="burger-menu__line"></span>
    </button>

    <nav class="nav" id="navMenu">
      <ul class="nav__list">
        <li><a href="index.html#about" class="nav__link">О ЦЕНТРЕ</a></li>
        <li><a href="index.html#formats" class="nav__link">ТАРИФЫ</a></li>
        <li><a href="index.html#lessons" class="nav__link">УРОКИ</a></li>
        <li><a href="blog.html" class="nav__link">БЛОГ</a></li>
        <li><a href="index.html#contacts" class="nav__link">СВЯЗЬ</a></li>
        <li><a href="nabors.html" class="nav__link">НАБОРЫ</a></li>
        <li><a href="rules.html" class="nav__link">Правила</a></li>
        
        <li class="mobile-lang-wrapper">
            <div class="lang-switcher">
                <button class="lang-btn is-active" onclick="changeLanguage('ru')">RU</button>
                <button class="lang-btn" onclick="changeLanguage('ar')">AR</button>
                <button class="lang-btn" onclick="changeLanguage('en')">EN</button>
            </div>
        </li>
      </ul>
    </nav>

    <div class="lang-switcher">
        <button class="lang-btn is-active" onclick="changeLanguage('ru')">RU</button>
        <button class="lang-btn" onclick="changeLanguage('ar')">AR</button>
        <button class="lang-btn" onclick="changeLanguage('en')">EN</button>
    </div>
  </div>
</header>

    <div id="google_translate_element"></div>

    <section class="nabors-section" style="margin-top: 110px;">
        <div class="nabors-container">
            <p class="nabors-subtitle">КУРСЫ</p>
            <h2 class="nabors-title">АКТУАЛЬНЫЕ НАБОРЫ</h2>
            
            <div class="slider-viewport">
                <div class="slider-track" id="sliderTrack">
                    
                    <div class="nabor-card">
                        <img src="assets/image10.jpg.png" alt="Мединский курс 1 том" class="nabor-img">
                    </div>

                    <div class="nabor-card">
                        <img src="assets/image11.jpg.png" alt="Байна Ядайк" class="nabor-img">
                    </div>

                    <div class="nabor-card">
                        <img src="assets/image12.jpg.png" alt="Котру Нада" class="nabor-img">
                    </div>

                </div>
            </div>

            <div class="slider-controls">
                <button class="slider-arrow" id="prevBtn" aria-label="Назад">&#8592;</button>
                <div class="slider-dots" id="sliderDots"></div>
                <button class="slider-arrow" id="nextBtn" aria-label="Вперед">&#8594;</button>
            </div>

            <div class="nabors-action">
                <a href="https://t.me/ArabicMarkaz_Mona/4288" target="_blank" class="nabor-main-btn">Записаться на курс</a>
            </div>

        </div>
    </section>

    <script src="script.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const track = document.getElementById('sliderTrack');
            const cards = document.querySelectorAll('.nabor-card');
            const prevButton = document.getElementById('prevBtn');
            const nextButton = document.getElementById('nextBtn');
            const dotsContainer = document.getElementById('sliderDots');
            
            let currentIndex = 0;
            const totalSlides = cards.length;

            // 1. Очищаем контейнер точек (на случай дублирования) и создаем их заново
            dotsContainer.innerHTML = '';
            for (let i = 0; i < totalSlides; i++) {
                const dot = document.createElement('div');
                dot.classList.add('slider-dot');
                if (i === 0) dot.classList.add('active');
                dot.addEventListener('click', () => {
                    goToSlide(i);
                });
                dotsContainer.appendChild(dot);
            }

            const dots = document.querySelectorAll('.slider-dot');

            // 2. Функция переключения слайдов
            function goToSlide(index) {
                if (index < 0) {
                    currentIndex = totalSlides - 1; // Если ушли влево за край — включаем последний
                } else if (index >= totalSlides) {
                    currentIndex = 0; // Если ушли вправо за край — возвращаемся на первый
                } else {
                    currentIndex = index;
                }
                
                // Передвигаем ленту строго на нужный коэффициент процентов
                track.style.transform = `translateX(-${currentIndex * 100}%)`;
                
                // Переключаем активный класс у точек под картинками
                dots.forEach((dot, i) => {
                    if (i === currentIndex) {
                        dot.classList.add('active');
                    } else {
                        dot.classList.remove('active');
                    }
                });
            }

            // 3. Жесткая привязка событий клика к кнопкам-стрелкам
            if (nextButton) {
                nextButton.addEventListener('click', (e) => {
                    e.preventDefault();
                    goToSlide(currentIndex + 1);
                });
            }

            if (prevButton) {
                prevButton.addEventListener('click', (e) => {
                    e.preventDefault();
                    goToSlide(currentIndex - 1);
                });
            }

            // 4. Поддержка свайпов пальцем для смартфонов
            let startX = 0;
            track.addEventListener('touchstart', e => {
                startX = e.touches[0].clientX;
            }, { passive: true });

            track.addEventListener('touchend', e => {
                const endX = e.changedTouches[0].clientX;
                if (startX - endX > 50) {
                    goToSlide(currentIndex + 1); // Свайпнули влево -> следующий слайд
                }
                if (endX - startX > 50) {
                    goToSlide(currentIndex - 1); // Свайпнули вправо -> предыдущий слайд
                }
            }, { passive: true });
        });
    </script>
    
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'ru',
                includedLanguages: 'ru,ar,en',
                autoDisplay: false
            }, 'google_translate_element');
        }

        function changeLanguage(langCode) {
            const googleSelect = document.querySelector('.goog-te-combo');
            if (googleSelect) {
                googleSelect.value = langCode;
                googleSelect.dispatchEvent(new Event('change'));
                
                document.querySelectorAll('.lang-btn').forEach(btn => {
                    if(btn.getAttribute('onclick').includes(`'${langCode}'`)) {
                        btn.classList.add('is-active');
                    } else {
                        btn.classList.remove('is-active');
                    }
                });
            }
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <script>
        // Код управления мобильным меню (бургер)
        document.addEventListener('DOMContentLoaded', () => {
            const burgerButton = document.getElementById('burgerButton');
            const navMenu = document.getElementById('navMenu');

            if (burgerButton && navMenu) {
                burgerButton.addEventListener('click', () => {
                    navMenu.classList.toggle('active');
                    burgerButton.classList.toggle('open'); 
                });

                const navLinks = navMenu.querySelectorAll('.nav__link');
                navLinks.forEach(link => {
                    link.addEventListener('click', () => {
                        navMenu.classList.remove('active');
                        burgerButton.classList.remove('open');
                    });
                });
            }
        });
    </script>
</body>
</html>
