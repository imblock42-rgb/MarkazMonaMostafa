<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="assets/Logo.jpg" type="image/png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

        <div class="nabor-card">

      <a href="https://t.me/ArabicMarkaz_Mona/4288" target="_blank" class="nabor-main-btn">Записаться на курс</a>
