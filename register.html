<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация | Markaz Al-Mona</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-body {
      background-color: #fcfcfc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
    }
    .auth-card {
      background: #ffffff;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.05);
      width: 100%;
      max-width: 400px;
      text-align: center;
      border-top: 4px solid #bc9c65;
    }
    .auth-card h2 {
      color: #111111;
      font-size: 24px;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .auth-card p {
      color: #666;
      font-size: 14px;
      margin-bottom: 24px;
    }
    .form-group {
      text-align: left;
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      color: #333;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      font-weight: 600;
    }
    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      font-size: 15px;
      box-sizing: border-box;
      transition: border-color 0.3s;
    }
    .form-group input:focus {
      border-color: #bc9c65;
      outline: none;
    }
    .auth-btn {
      width: 100%;
      background: #111111;
      color: #fff;
      border: none;
      padding: 14px;
      font-size: 14px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.3s;
      margin-top: 10px;
    }
    .auth-btn:hover {
      background: #bc9c65;
    }
    .auth-switch {
      margin-top: 20px;
      font-size: 14px;
      color: #666;
    }
    .auth-switch a {
      color: #bc9c65;
      text-decoration: none;
      font-weight: 600;
    }
    .auth-switch a:hover {
      text-decoration: underline;
    }
    .error-msg {
      color: #e74c3c;
      font-size: 13px;
      margin-top: 10px;
      display: none;
    }
    .success-msg {
      color: #2ecc71;
      font-size: 13px;
      margin-top: 10px;
      display: none;
    }
    .back-to-main {
      display: inline-block;
      margin-top: 20px;
      color: #999;
      text-decoration: none;
      font-size: 13px;
    }

    /* Стили для двух полей в одной строке (Имя и Фамилия) */
    .form-row {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }
    .form-row .form-group {
      flex: 1;
      margin-bottom: 0;
    }

    /* Стили для выбора пола с картинками */
    .gender-selection {
      display: flex;
      justify-content: space-around;
      margin-top: 10px;
      margin-bottom: 10px;
    }
    .gender-option {
      text-align: center;
      cursor: pointer;
    }
    .gender-option img {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      display: block;
      margin: 0 auto 8px;
      border: 2px solid transparent;
      transition: border-color 0.3s;
    }
    .gender-option input[type="radio"] {
      margin-right: 5px;
      cursor: pointer;
    }

    /* Стили для радио-кнопок направления обучения и чекбокса */
    .radio-group, .checkbox-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 8px;
    }
    .radio-label, .checkbox-label {
      display: flex;
      align-items: center;
      font-size: 14px;
      color: #333;
      cursor: pointer;
      font-weight: normal;
      text-transform: none;
    }
    .radio-label input, .checkbox-label input {
      width: auto !important;
      margin-right: 10px;
      cursor: pointer;
    }

    /* Телефонная группа с выбором кода страны */
    .phone-group {
      display: flex;
      gap: 8px;
    }
    .phone-group select {
      padding: 12px;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      font-size: 15px;
      background: #fff;
      outline: none;
      max-width: 140px;
    }

    /* Скрываем стандартный виджет Google, чтобы не портить дизайн */
    #google_translate_element, .skiptranslate, .goog-te-banner-frame {
        display: none !important;
    }
    body {
        top: 0 !important;
    }
  </style>
</head>
<body class="auth-body">

  <div class="auth-card">
    <a href="index.html">
      <img src="assets/Logo.jpg" alt="Logo" style="width: 60px; height: 60px; border-radius: 50%; margin-bottom: 15px;">
    </a>
    <h2>Регистрация</h2>
    <p>Создайте аккаунт для доступа к обучению</p>

    <form id="registerForm" onsubmit="return false;">
      
      <label style="display: block; text-align: left; font-size: 12px; color: #333; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; font-weight: 600;">
        Имя и Фамилия (на английском) *
      </label>
      <div class="form-row">
        <div class="form-group">
          <input type="text" id="regFirstName" required placeholder="Имя">
        </div>
        <div class="form-group">
          <input type="text" id="regLastName" required placeholder="Фамилия">
        </div>
      </div>

      <div class="form-group">
        <label for="regUsername">Имя пользователя (Логин) *</label>
        <input type="text" id="regUsername" required placeholder="Придумайте логин">
      </div>

      <div class="form-group">
        <label for="regPassword">Пароль *</label>
        <input type="password" id="regPassword" required minlength="6" placeholder="Минимум 6 символов">
      </div>

      <div class="form-group">
        <label for="regEmail">Электронная почта *</label>
        <input type="email" id="regEmail" required placeholder="example@mail.com">
      </div>

      <div class="form-group">
        <label for="regPhone">Телефон (WhatsApp) *</label>
        <div class="phone-group">
          <select id="phoneCode">
            <option value="+994">🇦🇿 +994 (Азербайджан)</option>
            <option value="+374">🇦🇲 +374 (Армения)</option>
            <option value="+93">🇦🇫 +93 (Афганистан)</option>
            <option value="+973">🇧🇭 +973 (Бахрейн)</option>
            <option value="+375">🇧🇾 +375 (Беларусь)</option>
            <option value="+995">🇬🇪 +995 (Грузия)</option>
            <option value="+20">🇪🇬 +20 (Египет)</option>
            <option value="+972">🇮🇱 +972 (Израиль)</option>
            <option value="+91">🇮🇳 +91 (Индия)</option>
            <option value="+9 Jordan">🇯🇴 +962 (Иордания)</option>
            <option value="+964">🇮🇶 +964 (Ирак)</option>
            <option value="+98">🇮🇷 +98 (Иран)</option>
            <option value="+7">🇰🇿 +7 (Казахстан)</option>
            <option value="+974">🇶🇦 +974 (Катар)</option>
            <option value="+86">🇨🇳 +86 (Китай)</option>
            <option value="+965">🇰🇼 +965 (Кувейт)</option>
            <option value="+996">🇰🇬 +996 (Кыргызстан)</option>
            <option value="+961">🇱🇧 +961 (Ливан)</option>
            <option value="+976" selected>🇲🇳 +976 (Монголия)</option>
            <option value="+7">🇷🇺 +7 (Россия)</option>
            <option value="+966">🇸🇦 +966 (Сауд. Аравия)</option>
            <option value="+963">🇸🇾 +963 (Сирия)</option>
            <option value="+992">🇹🇯 +992 (Таджикистан)</option>
            <option value="+90">🇹🇷 +90 (Турция)</option>
            <option value="+993">🇹🇲 +993 (Туркменистан)</option>
            <option value="+971">🇦🇪 +971 (ОАЭ)</option>
            <option value="+998">🇺🇿 +998 (Узбекистан)</option>
          </select>
          <input type="tel" id="regPhone" required placeholder="Номер телефона">
        </div>
      </div>

      <div class="form-group">
        <label>Пол *</label>
        <div class="gender-selection">
          <label class="gender-option">
            <img src="assets/male-avatar.png" alt="Мужской" onerror="this.src='https://placehold.co/70x70?text=M'">
            <input type="radio" name="gender" value="male" required> Мужской
          </label>
          <label class="gender-option">
            <img src="assets/female-avatar.png" alt="Женский" onerror="this.src='https://placehold.co/70x70?text=F'">
            <input type="radio" name="gender" value="female" required> Женский
          </label>
        </div>
      </div>

      <div class="form-group">
        <label>Что вы хотите изучать? *</label>
        <div class="radio-group">
          <label class="radio-label">
            <input type="radio" name="course" value="arabic" required> Арабский язык
          </label>
          <label class="radio-label">
            <input type="radio" name="course" value="quran"> Священный Коран
          </label>
          <label class="radio-label">
            <input type="radio" name="course" value="kids"> Арабский язык для детей
          </label>
        </div>
      </div>

      <div class="form-group" style="margin-top: 20px;">
        <div class="checkbox-group">
          <label class="checkbox-label">
            <input type="checkbox" id="createAccountCheckbox" checked required> Я хочу создать аккаунт
          </label>
        </div>
      </div>
       
      <div class="error-msg" id="regError">Это имя пользователя уже занято!</div>
      <div class="success-msg" id="regSuccess">Регистрация успешна! Перенаправление...</div>
       
      <button type="submit" id="submitRegBtn" class="auth-btn">Пропустить пробный период и забронировать сейчас!</button>
    </form>

    <div class="auth-switch">
      Уже есть аккаунт? <a href="login.html">Войти</a>
    </div>
    <a href="index.html" class="back-to-main">← На главную</a>
  </div>

  <div id="google_translate_element"></div>

  <script src="login.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const registerForm = document.getElementById('registerForm');
      const submitBtn = document.getElementById('submitRegBtn');
      const errorMsg = document.getElementById('regError');
      const successMsg = document.getElementById('regSuccess');

      if (submitBtn && registerForm) {
        submitBtn.addEventListener('click', () => {
          if (!registerForm.checkValidity()) {
            registerForm.reportValidity();
            return;
          }

          errorMsg.style.display = 'none';
          successMsg.style.display = 'block';

          setTimeout(() => {
            window.location.href = 'index.html';
          }, 1500);
        });
      }
    });

    function googleTranslateElementInit() {
        new google.translate.TranslateElement({
            pageLanguage: 'ru',
            includedLanguages: 'ru,ar,en',
            autoDisplay: false
        }, 'google_translate_element');
    }
  </script>
  <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
