<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход | Markaz Al-Mona</title>
  <link rel="stylesheet" href="style.css"> 
  <style>
    .auth-body {
      background-color: #fcfcfc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
    }
    .auth-card {
      background: #ffffff;
      padding: 40px;
      border-radius: 8px;
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.05);
      width: 100%;
      max-width: 400px;
      text-align: center;
      border-top: 4px solid #bc9c65;
    }
    .auth-card h2 {
      color: #111111;
      font-size: 24px;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .auth-card p {
      color: #666;
      font-size: 14px;
      margin-bottom: 24px;
    }
    .form-group {
      text-align: left;
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      color: #333;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      font-weight: 600;
    }
    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #e0e0e0;
      border-radius: 4px;
      font-size: 15px;
      box-sizing: border-box;
      transition: border-color 0.3s;
    }
    .form-group input:focus {
      border-color: #bc9c65;
      outline: none;
    }
    .auth-btn {
      width: 100%;
      background: #111111;
      color: #fff;
      border: none;
      padding: 14px;
      font-size: 14px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.3s;
      margin-top: 10px;
    }
    .auth-btn:hover {
      background: #bc9c65;
    }
    .auth-switch {
      margin-top: 20px;
      font-size: 14px;
      color: #666;
    }
    .auth-switch a {
      color: #bc9c65;
      text-decoration: none;
      font-weight: 600;
    }
    .auth-switch a:hover {
      text-decoration: underline;
    }
    .error-msg {
      color: #e74c3c;
      font-size: 13px;
      margin-top: 10px;
      display: none;
    }
    .back-to-main {
      display: inline-block;
      margin-top: 20px;
      color: #999;
      text-decoration: none;
      font-size: 13px;
    }
  </style>
</head>
<body class="auth-body">

  <div class="auth-card">
    <a href="index.html">
      <img src="assets/Logo.jpg" alt="Logo" style="width: 60px; height: 60px; border-radius: 50%; margin-bottom: 15px;">
    </a>
    <h2>Войти в аккаунт</h2>
    <p>Добро пожаловать обратно в Markaz Al-Mona</p>

    <form id="loginForm" onsubmit="return false;">
      <div class="form-group">
        <label for="loginUsername">Имя пользователя (Логин)</label>
        <input type="text" id="loginUsername" required placeholder="Введите ваш логин">
      </div>
      <div class="form-group">
        <label for="loginPassword">Пароль</label>
        <input type="password" id="loginPassword" required placeholder="••••••••">
      </div>
      
      <div class="error-msg" id="loginError">Неверное имя пользователя или пароль!</div>
      
      <button type="submit" id="submitLoginBtn" class="auth-btn">Войти</button>
    </form>

    <div class="auth-switch">
      Нет аккаунта? <a href="register.html">Зарегистрироваться</a>
    </div>
    <a href="index.html" class="back-to-main">← На главную</a>
  </div>

  <script src="login.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const loginForm = document.getElementById('loginForm');
      const submitBtn = document.getElementById('submitLoginBtn');
      const errorMsg = document.getElementById('loginError');

      if (submitBtn && loginForm) {
        submitBtn.addEventListener('click', () => {
          const usernameInput = document.getElementById('loginUsername');
          const passwordInput = document.getElementById('loginPassword');

          // Проверка валидности полей
          if (!usernameInput.checkValidity() || !passwordInput.checkValidity()) {
            loginForm.reportValidity();
            return;
          }

          // Скрываем ошибку, если она была выведена ранее
          errorMsg.style.display = 'none';

          // Здесь симулируется успешная авторизация и происходит редирект на главную
          window.location.href = 'index.html';
        });
      }
    });
  </script>
</body>
</html>
